# The Toolshop app (practicesoftwaretesting.com), run inside CI.
# The public site blocks GitHub runner IPs (Cloudflare 403), so CI tests this pinned copy instead.
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DISABLE_LOGGING: "true"
    volumes:
      - api-code:/var/www

  web:
    image: testsmith/practice-software-testing-web:latest
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  api-code:
