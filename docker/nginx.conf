# Same as the app's own _docker/vhost.conf: nginx in front of the Laravel API (php-fpm).
server {
    listen 80;
    root /var/www/public;
    index index.php;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
